<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Usev - Moderatör</title>
<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#f5c518">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Usev">
<link rel="apple-touch-icon" href="icon-apple.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;600&display=swap');
:root{
  --bg:#07070a;--surface:#0e0e14;--card:#131319;--card2:#1a1a22;--border:#1f1f2a;
  --accent:#f5c518;--accent2:#e84040;--accent3:#3dd68c;--purple:#a855f7;
  --text:#f0f0f0;--muted:#52526a;
  --mono:'IBM Plex Mono',monospace;--sans:'IBM Plex Sans',sans-serif;--display:'Bebas Neue',sans-serif;
  --c0:#e84040;--c1:#3b82f6;--c2:#f5c518;--c3:#3dd68c;--c4:#a855f7;--c5:#f97316;
  --col-left:260px;--col-right:290px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);overflow:hidden;}
.katex{font-size:.88em;}

/* HEADER */
.hdr{
  background:var(--surface);
  border-bottom:2px solid var(--accent);
  height:56px;padding:0 18px;
  display:flex;align-items:center;gap:12px;
  flex-shrink:0;position:relative;z-index:30;
}
.header-main{width:100%;display:flex;align-items:center;gap:12px;}
.header-logo{font-family:var(--display);font-size:1.6rem;letter-spacing:4px;color:var(--accent);flex-shrink:0;cursor:pointer;}
.hdr-divider{width:1px;height:28px;background:var(--border);flex-shrink:0;}
.phase-pill{
  font-family:var(--display);font-size:1rem;letter-spacing:3px;
  padding:4px 14px;border-radius:20px;flex-shrink:0;
  transition:all .3s;
}
.phase-pill.lobby{background:rgba(61,214,140,.1);border:1px solid rgba(61,214,140,.25);color:var(--accent3);}
.phase-pill.game{background:rgba(245,197,24,.1);border:1px solid rgba(245,197,24,.3);color:var(--accent);}
.hdr-spacer{flex:1;}
.hdr-timer{
  font-family:var(--display);font-size:1.8rem;letter-spacing:4px;
  min-width:64px;text-align:center;padding:3px 12px;
  border-radius:10px;border:2px solid var(--border);
  background:var(--card);color:var(--muted);
  transition:all .3s;flex-shrink:0;
}
.hdr-timer.running{border-color:var(--accent3);background:rgba(61,214,140,.07);color:var(--accent3);}
.hdr-timer.urgent{border-color:var(--accent2);background:rgba(232,64,64,.12);color:var(--accent2);animation:htp .45s infinite alternate;}
@keyframes htp{from{transform:scale(1);}to{transform:scale(1.05);}}

.header-conn{display:flex;align-items:center;gap:8px;flex-wrap:nowrap;overflow:hidden;}
.conn-badge{
  display:flex;align-items:center;gap:5px;
  font-family:var(--mono);font-size:.62rem;
  padding:4px 11px;border-radius:20px;
  background:rgba(61,214,140,.08);border:1px solid rgba(61,214,140,.2);
  color:var(--accent3);flex-shrink:0;
}
.dot{width:7px;height:7px;border-radius:50%;background:var(--accent3);animation:blink 1.5s infinite;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.15;}}

.user-badge{
  font-family:var(--mono);font-size:.62rem;padding:4px 10px;border-radius:20px;
  background:rgba(245,197,24,.07);border:1px solid rgba(245,197,24,.18);
  color:var(--accent);cursor:pointer;flex-shrink:0;transition:background .15s;
  white-space:nowrap;max-width:120px;overflow:hidden;text-overflow:ellipsis;
}
.user-badge:hover{background:rgba(245,197,24,.14);}

.hdr-btn{
  font-family:var(--mono);font-size:.6rem;padding:5px 11px;
  border:1px solid var(--border);background:var(--card);color:var(--muted);
  border-radius:5px;cursor:pointer;transition:all .15s;white-space:nowrap;
  display:flex;align-items:center;gap:4px;
}
.hdr-btn:hover{border-color:var(--accent);color:var(--accent);}
.hdr-btn span{display:inline;}

@media (max-width: 1100px) {
  .hdr-btn span { display: none; }
  .user-badge { max-width: 80px; }
  .header-logo span { display: none; }
}
@media (max-width: 850px) {
  .mode-selector { transform: scale(0.85); }
  .header-conn { gap: 4px; }
  .hdr-btn { padding: 5px 8px; }
}

/* Phase actions bar */
.phase-bar{
  height:46px;padding:0 18px;
  background:var(--surface);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:8px;flex-shrink:0;
}
.phase-bar .spacer{flex:1;}
.status-pill{
  font-family:var(--mono);font-size:.6rem;color:var(--muted);
  padding:3px 10px;background:var(--card);border:1px solid var(--border);
  border-radius:4px;flex:1;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}

/* Workspace */
.workspace{
  display:grid;
  grid-template-columns:var(--col-left) 1fr var(--col-right);
  height:calc(100vh - 102px);
  overflow:hidden;
}
.col{overflow-y:auto;overflow-x:hidden;}
.col::-webkit-scrollbar{width:4px;}
.col::-webkit-scrollbar-track{background:transparent;}
.col::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}

.col-left{
  border-right:1px solid var(--border);
  background:var(--surface);
  padding:14px;display:flex;flex-direction:column;gap:10px;
}
.slbl{
  font-family:var(--mono);font-size:.55rem;color:var(--muted);
  letter-spacing:2px;text-transform:uppercase;margin-bottom:6px;
  display:flex;align-items:center;gap:6px;
}
.pin-card{background:var(--card);border:1px solid var(--border);border-radius:9px;padding:12px;}
.pin-val{font-family:var(--display);font-size:2.8rem;letter-spacing:12px;color:var(--accent);text-align:center;background:var(--bg);border-radius:6px;padding:6px 0;margin:6px 0;}
.pin-actions{display:flex;gap:5px;}

.col-mid{padding:16px;display:flex;flex-direction:column;gap:12px;}
.flow-steps{
  display:flex;align-items:center;gap:0;background:var(--card);
  border:1px solid var(--border);border-radius:10px;overflow:hidden;flex-shrink:0;
}
.flow-step{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:8px 4px;text-align:center;border-right:1px solid var(--border);
  transition:background .2s;
}
.flow-step:last-child{border-right:none;}
.flow-step.active{background:rgba(245,197,24,.07);}
.flow-step.done-step{background:rgba(61,214,140,.04);}
.flow-step-icon{font-size:1.1rem;margin-bottom:2px;}
.flow-step-lbl{font-family:var(--mono);font-size:.52rem;color:var(--muted);letter-spacing:.5px;}

.ctrl-wrap{
  background:var(--card);border:1px solid var(--border);border-radius:10px;
  padding:14px;display:flex;flex-direction:column;gap:10px;flex-shrink:0;
}
.ctrl-main{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.btn{font-family:var(--display);letter-spacing:2px;padding:8px 18px;border:none;cursor:pointer;border-radius:6px;transition:all .18s;font-size:.88rem;}
.btn-primary{background:var(--accent);color:#000;}
.btn-green{background:var(--accent3);color:#000;}
.btn-danger{background:var(--accent2);color:#fff;}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--muted);font-family:var(--mono);font-size:.62rem;letter-spacing:1px;padding:7px 13px;}
.btn-sm{padding:5px 11px;font-size:.75rem;}

.qcard{
  background:var(--card);border:1px solid var(--border);border-radius:10px;
  overflow:hidden;flex:1;display:flex;flex-direction:column;
}
.qcard-top{padding:14px 16px;border-bottom:1px solid var(--border);}
.qtitle{font-family:var(--display);font-size:1.3rem;letter-spacing:1px;margin-bottom:8px;line-height:1.3;}
.qtext{
  font-family:var(--mono);font-size:.78rem;color:var(--accent);
  padding:9px 13px;background:rgba(245,197,24,.05);
  border-left:3px solid var(--accent);border-radius:0 6px 6px 0;
  line-height:1.65;
}
.qcard-body{padding:14px 16px;flex:1;overflow-y:auto;}
.opts-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;}

.col-right{
  border-left:1px solid var(--border);
  background:var(--surface);
  padding:14px;display:flex;flex-direction:column;gap:10px;
}
.live-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;}
.ls-card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:8px;text-align:center;}
.ls-val{font-family:var(--display);font-size:1.6rem;color:var(--accent);letter-spacing:1px;line-height:1;}
.lb-list{display:flex;flex-direction:column;gap:3px;max-height:200px;overflow-y:auto;}

/* Overlays */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:200;align-items:center;justify-content:center;}
.overlay.visible{display:flex;}
.overlay-box{background:var(--surface);border:2px solid var(--accent);border-radius:14px;padding:28px;max-width:460px;width:93%;}

.mode-selector{display:flex;background:rgba(255,255,255,0.05);padding:3px;border-radius:30px;border:1px solid var(--border);gap:2px;}
.mode-btn{border:none;background:transparent;color:var(--muted);font-family:var(--mono);font-size:.52rem;padding:6px 14px;border-radius:20px;cursor:pointer;transition:all .3s;}
.mode-btn.active{background:var(--accent);color:#000;box-shadow:0 0 15px var(--accent);}
.mode-btn.active::after{content:' ✓';}

.shortcut-pill{position:fixed;bottom:18px;right:18px;z-index:100;font-family:var(--mono);font-size:.58rem;padding:5px 12px;background:var(--card);border:1px solid var(--border);color:var(--muted);border-radius:20px;cursor:pointer;}
</style>
</head>
<body>

<div class="hdr">
  <div class="header-main">
    <div class="header-logo" onclick="location.reload()">⚡ USEV <span>MOD</span></div>
    <div style="flex:1;display:flex;justify-content:center;">
      <div class="mode-selector" id="modeSelector">
        <button class="mode-btn active" data-mode="academy" onclick="setGameMode('academy')">🎓 AKADEMİ</button>
        <button class="mode-btn" data-mode="showtime" onclick="setGameMode('showtime')">✨ SHOWTIME</button>
        <button class="mode-btn" data-mode="turbo" onclick="setGameMode('turbo')">🚀 TURBO</button>
      </div>
    </div>
    <div class="header-conn">
      <div class="phase-pill lobby" id="phaseVal" style="font-size:0.8rem;padding:3px 10px;">LOBİ</div>
      <div class="hdr-timer" id="timerDisp" style="font-size:1.2rem;min-width:50px;">--</div>
      <div class="hdr-divider"></div>
      <div class="conn-badge" style="white-space:nowrap;"><div class="dot"></div><span id="connCount">0</span></div>
      <span class="user-badge" id="userBadge" onclick="openChangePw()">👤 admin</span>
      <button class="hdr-btn" onclick="goRoom('editor.html')">📝 <span>Editör</span></button>
      <button class="hdr-btn" onclick="goRoom('istatistik.html')">📊 <span>İstatistik</span></button>
      <button class="hdr-btn" id="accMgmtBtn" onclick="openAccMgmt()" style="display:none;">👥 <span>Hesaplar</span></button>
      <button class="hdr-btn" onclick="doLogout()">🚪 <span>Çıkış</span></button>
    </div>
  </div>
</div>

<div class="phase-bar">
  <button class="btn btn-danger btn-sm" onclick="confirmReset()">🗑️ Sıfırla</button>
  <button class="btn btn-green btn-sm" id="startBtn" onclick="startGame()" disabled>🚀 YARIŞMAYI BAŞLAT</button>
  <div class="spacer"></div>
  <div class="status-pill" id="statusMsg">Bağlantı bekleniyor...</div>
</div>

<div class="workspace">
  <div class="col col-left">
    <div>
      <div class="slbl">🔑 Giriş Parolası</div>
      <div class="pin-card">
        <div class="pin-val" id="pinDisplay">--</div>
        <div class="pin-actions">
          <button class="btn btn-primary btn-sm" onclick="generatePin()" style="flex:1;">🎲 Yeni</button>
          <button class="btn btn-ghost btn-sm" onclick="clearPin()" style="flex:1;">🗑️ Sil</button>
        </div>
      </div>
    </div>
    <div class="game-controls locked" id="gameControls">
      <div class="slbl">📋 Sorular</div>
      <div id="setButtonsMod" class="set-btns"></div>
      <div id="roundNav" class="rnav"></div>
    </div>
  </div>

  <div class="col col-mid">
    <div class="flow-steps">
      <div class="flow-step" id="fs-show"><div class="flow-step-icon">📖</div><div class="flow-step-lbl">GÖSTER</div></div>
      <div class="flow-step" id="fs-answer"><div class="flow-step-icon">▶</div><div class="flow-step-lbl">CEVAPLA</div></div>
      <div class="flow-step" id="fs-reveal"><div class="flow-step-icon">✅</div><div class="flow-step-lbl">CEVAP</div></div>
    </div>
    <div class="ctrl-wrap game-controls locked" id="gameControls2">
      <div class="ctrl-main">
        <button class="btn btn-ghost btn-sm" id="previewBtn" onclick="previewRound()" disabled>📖 GÖSTER</button>
        <button class="btn btn-primary" id="publishBtn" onclick="publishRound()" disabled>📡 YAYINLA</button>
        <button class="btn btn-danger" id="revealBtn" onclick="revealAnswer()" disabled>✅ CEVAP</button>
        <button class="btn btn-ghost btn-sm" onclick="nextRound()">→ SONRAKİ</button>
      </div>
    </div>
    <div class="qcard">
      <div class="qcard-top">
        <div class="qtitle" id="qTitle">-</div>
        <div class="qtext" id="qText">Soru seçin.</div>
      </div>
      <div class="qcard-body">
        <div class="opts-grid" id="optsGrid"></div>
      </div>
    </div>
  </div>

  <div class="col col-right">
    <div class="slbl">📊 Canlı</div>
    <div class="live-stats">
      <div class="ls-card"><div class="ls-val" id="sCevap">0</div><div class="ls-lbl">Cevap</div></div>
      <div class="ls-card"><div class="ls-val" id="sDoğru">0</div><div class="ls-lbl">Doğru</div></div>
    </div>
    <div id="answersLive" class="ans-list"></div>
    <div class="slbl" style="margin-top:12px;">🏆 Sıralama</div>
    <div id="lbList" class="lb-list"></div>
  </div>
</div>

<script type="module">
  import { db, ref, fbGet, fbSet, fbUpdate, auth, onValue } from "./js/core/firebase.js";
  import { requireModeratorSession, doLogout } from "./js/core/auth.js";
  import { roomId, orgId, gameRef, orgRef, goRoom } from "./js/core/paths.js";
  import { openAccMgmt, addAccount, deleteAccount, toggleResetForm, resetPassword, addOrg, selectNewRole } from "./js/moderator/account.js";
  import { updateConnectionsList, updateFlowStep } from "./js/moderator/ui.js";
  import { gameStore, setLobby, startGame, initGameListeners, doReplay, finishGame, exportResults, stopTimer, previewRound, openAnswering, publishRound, revealAnswer, renderRound, renderNav, nextRound, setGameMode, generatePin, clearPin, initPinListener, toggleTeamMode, addTeam, saveTeams, loadModSet, sendReactionSignal } from "./js/moderator/game.js";
  import { initListeners } from "./js/moderator/listeners.js";
  import { openAnalytics, closeAnalytics, updateLiveAnswers } from "./js/moderator/stats.js";

  if (!(await requireModeratorSession())) throw new Error('Auth required');
  const modUser = sessionStorage.getItem('modUser') || 'admin';
  const modRole = sessionStorage.getItem('modRole') || 'moderator';
  const isAdmin = modRole === 'admin';
  
  document.getElementById('userBadge').textContent = `👤 ${modUser}${isAdmin ? ' ⭐' : ''}`;
  if (isAdmin) document.getElementById('accMgmtBtn').style.display = 'block';

  onValue(ref(db, '.info/connected'), (snap) => {
    const sm = document.getElementById('statusMsg');
    if (snap.val() === true) {
      sm.textContent = 'Veritabanına bağlı.';
    } else {
      sm.textContent = '❌ Bağlantı kesildi...';
    }
  });

  window.goRoom = goRoom;
  window.startGame = startGame;
  window.doLogout = doLogout;
  window.openAccMgmt = () => openAccMgmt(isAdmin, modUser);
  window.setGameMode = setGameMode;
  window.generatePin = generatePin;
  window.clearPin = clearPin;
  window.previewRound = previewRound;
  window.publishRound = publishRound;
  window.revealAnswer = revealAnswer;
  window.nextRound = nextRound;
  window.loadModSet = loadModSet;

  initGameListeners();
  initListeners({
    onQuestionsLoaded: () => { renderNav(); renderRound(); },
    onConnectionsUpdated: (c, k) => updateConnectionsList(c, k),
    onAnswersUpdated: (a) => updateLiveAnswers(a)
  });
  setLobby();
  initPinListener();
</script>

</body>
</html>
