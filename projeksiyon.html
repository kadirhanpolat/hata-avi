<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Usev - Projeksiyon</title>
<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#f5c518">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Usev">
<link rel="apple-touch-icon" href="icon-apple.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;600&display=swap');
:root{
  --bg:#070709;--surface:#0e0e12;--card:#13131a;--border:#1e1e28;
  --accent:#f5c518;--accent2:#e84040;--accent3:#3dd68c;--purple:#a855f7;
  --text:#f0f0f0;--muted:#4a4a5a;
  --mono:'IBM Plex Mono',monospace;--sans:'IBM Plex Sans',sans-serif;--display:'Bebas Neue',sans-serif;
  --c0:#e84040;--c1:#3b82f6;--c2:#f5c518;--c3:#3dd68c;--c4:#a855f7;--c5:#f97316;
  --lb-w: 240px;
}
body{background:var(--bg);color:var(--text);font-family:var(--sans);margin:0;overflow:hidden;transition:background 1s ease;}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;overflow:hidden;}

/* COUNTDOWN OVERLAY */
#countdownOverlay{
  display:none;position:fixed;inset:0;background:var(--bg);z-index:500;
  align-items:center;justify-content:center;flex-direction:column;gap:16px;
}
#countdownOverlay.visible{display:flex;}
.cd-num{
  font-family:var(--display);font-size:22rem;letter-spacing:-8px;
  color:var(--accent);line-height:1;
  animation:cdPop .8s ease;
}
@keyframes cdPop{
  0%{transform:scale(.3);opacity:0;}
  60%{transform:scale(1.1);}
  100%{transform:scale(1);opacity:1;}
}

/* LOBBY SCREEN */
#lobbyScreen{width:100%;height:100vh;display:flex;flex-direction:column;}
.lh{
  background:var(--surface);border-bottom:3px solid var(--accent);
  padding:18px 44px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;
}
.lh-title{font-family:var(--display);font-size:3rem;letter-spacing:5px;color:var(--accent);line-height:1;}
.lh-sub{font-family:var(--mono);font-size:.7rem;color:var(--muted);letter-spacing:2px;margin-top:3px;}
.lh-conn{
  font-family:var(--display);font-size:1.4rem;letter-spacing:2px;
  padding:6px 18px;border-radius:20px;
  background:rgba(61,214,140,.1);border:1px solid rgba(61,214,140,.3);color:var(--accent3);
  display:flex;align-items:center;gap:8px;
}
.dot{width:10px;height:10px;border-radius:50%;background:var(--accent3);display:inline-block;animation:blink 1.5s infinite;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.15;}}

.lobby-body{flex:1;display:grid;grid-template-columns:300px 1fr 300px;overflow:hidden;}
.ll{padding:28px 22px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:20px;border-right:1px solid var(--border);}
.qr-box{background:white;padding:13px;border-radius:10px;display:inline-block;}
.pin-box{width:100%;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px;text-align:center;}
.pin-val{font-family:var(--display);font-size:4.5rem;letter-spacing:16px;color:var(--accent);line-height:1;}

.lc{padding:26px 30px;overflow:hidden;display:flex;flex-direction:column;}
.lc-title{font-family:var(--display);font-size:1.6rem;letter-spacing:3px;color:var(--accent);margin-bottom:4px;}
.players-grid{flex:1;overflow:hidden;display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:min-content;gap:7px;align-content:start;}
.pchip{display:flex;align-items:center;gap:7px;padding:9px 13px;background:var(--card);border:1px solid var(--border);border-radius:8px;animation:chipIn .4s ease;}
@keyframes chipIn{from{opacity:0;transform:scale(.82);}to{opacity:1;transform:scale(1);}}

/* GAME SCREEN */
#gameScreen{
  width:100%;height:100vh;display:none;
  flex-direction:column;
  padding-right:var(--lb-w);
}
.gh{
  background:var(--surface);border-bottom:3px solid var(--accent);
  padding:0 28px;height:68px;
  display:flex;align-items:center;gap:18px;
  flex-shrink:0;
}
.gh-logo{font-family:var(--display);font-size:2rem;letter-spacing:4px;color:var(--accent);flex-shrink:0;}
.timer-pill{
  display:flex;align-items:center;justify-content:center;
  width:88px;height:88px;border-radius:50%;
  border:4px solid var(--border);
  background:var(--card);
  flex-shrink:0;
}
.timer-num{font-family:var(--display);font-size:2.8rem;color:var(--muted);letter-spacing:2px;line-height:1;}

.game-body{flex:1;overflow:hidden;display:flex;flex-direction:column;padding:14px 22px;gap:12px;}
.question-area{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px 24px;flex-shrink:0;}
.q-text{font-family:var(--mono);font-size:1.05rem;color:var(--accent);line-height:1.55;word-break:break-word;}

.opts-kahoot{display:grid;flex:1;gap:9px;}
.opt-k{border-radius:12px;display:flex;flex-direction:column;overflow:hidden;position:relative;min-height:90px;}
.opt-sym{font-size:2.8rem;width:44px;flex-shrink:0;color:#fff;text-align:center;line-height:1;opacity:.9;}
.opt-text{font-family:var(--mono);font-size:1rem;line-height:1.4;color:#fff;word-break:break-word;}

.reveal-panel{
  display:none;background:var(--card);border:1px solid var(--border);border-radius:12px;
  padding:16px 22px;flex-shrink:0;
}
.reveal-panel.visible{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.reveal-title{font-family:var(--display);font-size:1.4rem;letter-spacing:3px;color:var(--accent3);margin-bottom:3px;}

/* LEADERBOARD */
.lb-side{
  display:none;position:fixed;right:0;top:0;height:100vh;width:var(--lb-w);
  background:rgba(7,7,9,.97);border-left:1px solid var(--border);
  padding:16px 14px;overflow-y:auto;z-index:50;flex-direction:column;gap:5px;
}
.lb-side.visible{display:flex;}
.lb-side-title{font-family:var(--display);font-size:1.05rem;letter-spacing:3px;color:var(--accent);border-bottom:1px solid var(--border);padding-bottom:7px;}
.lbs-row{display:flex;align-items:center;gap:7px;padding:7px 10px;background:var(--card);border-radius:6px;border:1px solid var(--border);}
.lbs-score{font-family:var(--display);font-size:1rem;color:var(--accent3);letter-spacing:1px;}

/* PODIUM */
#podiumScreen{display:none;width:100%;height:100vh;flex-direction:column;align-items:center;justify-content:center;background:var(--bg);position:relative;overflow:hidden;}
.podium-title{font-family:var(--display);font-size:3.5rem;letter-spacing:7px;color:var(--accent);margin-bottom:8px;z-index:2;text-align:center;}
.podium-stage{display:flex;align-items:flex-end;justify-content:center;gap:14px;z-index:2;}
.podium-block{width:230px;border-radius:8px 8px 0 0;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:3.8rem;color:rgba(0,0,0,.35);}

/* VICTORY OVERLAY */
.team-victory-overlay{position:fixed;inset:0;background:#000;z-index:2000;display:none;flex-direction:column;align-items:center;justify-content:center;}
.team-victory-overlay.visible{display:flex;}
.tv-team-name{font-family:var(--display);font-size:6rem;letter-spacing:10px;text-align:center;text-shadow:0 0 40px rgba(255,255,255,0.3);}
</style>
</head>
<body>

<!-- VICTORY -->
<div class="team-victory-overlay" id="teamVictoryOverlay">
  <div style="font-family:var(--display);font-size:2rem;letter-spacing:4px;color:rgba(255,255,255,0.7);margin-bottom:10px;">ŞAMPİYON TAKIM</div>
  <div class="tv-team-name" id="tvTeamName">-</div>
  <div style="font-family:var(--mono);font-size:.8rem;color:rgba(255,255,255,0.5);margin-top:20px;letter-spacing:5px;">ZAFER KAZANILDI!</div>
</div>

<!-- LOBBY -->
<div id="lobbyScreen">
  <div class="lh">
    <div class="lh-brand">
      <div class="lh-title">⚡ USEV</div>
      <div class="lh-sub">Düşün, yarış, kazan.</div>
    </div>
    <div class="lh-conn"><span class="dot"></span><span id="lobbyCount">0</span> katılımcı</div>
  </div>
  <div class="lobby-body">
    <div class="ll">
      <div class="qr-box"><img id="qrImg" src="" alt="QR"></div>
      <div class="pin-box"><div class="pin-val" id="projPin">--</div></div>
    </div>
    <div class="lc">
      <div class="lc-title">KATILIMCILAR</div>
      <div class="players-grid" id="playersGrid"></div>
    </div>
    <div class="lr">
      <div style="font-family:var(--display);font-size:1.6rem;letter-spacing:3px;color:var(--accent);">KATILMAK İÇİN QR KODU OKUTUN</div>
    </div>
  </div>
</div>

<!-- GAME -->
<div id="gameScreen">
  <div class="gh">
    <div class="gh-logo">⚡ USEV</div>
    <div class="gh-spacer"></div>
    <div class="timer-pill" id="timerPill"><div class="timer-num" id="gTimer">-</div></div>
  </div>
  <div class="game-body">
    <div class="question-area"><div class="q-text" id="gQ"></div></div>
    <div class="opts-kahoot g2" id="gOpts"></div>
    <div class="reveal-panel" id="revealPanel">
      <div><div class="reveal-title">✅ DOĞRU CEVAP</div><div id="revealText" style="font-family:var(--mono);font-size:1rem;color:var(--accent3);"></div></div>
    </div>
  </div>
</div>

<!-- LEADERBOARD -->
<div class="lb-side" id="lbSide">
  <div class="lb-side-title">🏆 SIRALAMA</div>
  <div id="lbRows"></div>
</div>

<!-- PODIUM -->
<div id="podiumScreen">
  <div class="podium-title">🏆 OYUN BİTTİ!</div>
  <div class="podium-stage" id="podiumStage"></div>
</div>

<script type="module" src="./js/projeksiyon/main.js"></script>
</body>
</html>
