<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Usev - Katılımcı</title>
<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#f5c518">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Usev">
<link rel="apple-touch-icon" href="icon-apple.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;600&display=swap');
:root{
  --bg:#09090b;--surface:#111113;--card:#18181b;--card2:#202024;--border:#27272a;
  --accent:#f5c518;--accent2:#e84040;--accent3:#3dd68c;--purple:#a855f7;
  --text:#f4f4f5;--muted:#71717a;
  --mono:'IBM Plex Mono',monospace;--sans:'IBM Plex Sans',sans-serif;--display:'Bebas Neue',sans-serif;
  --c0:#e84040;--c1:#3b82f6;--c2:#f5c518;--c3:#3dd68c;--c4:#a855f7;--c5:#f97316;
  --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{height:100%;}
body{
  background:var(--bg);color:var(--text);font-family:var(--sans);
  height:100%;max-width:480px;margin:0 auto;
  display:flex;flex-direction:column;overflow:hidden;
}

.screen-root{flex:1;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;}
.screen-root::-webkit-scrollbar{display:none;}

/* HEADER */
.hdr{
  background:rgba(9,9,11,.92);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
  padding:0 14px;height:54px;min-height:54px;
  display:flex;align-items:center;gap:10px;
  flex-shrink:0;position:sticky;top:0;z-index:50;
}
.hdr-logo{font-family:var(--display);font-size:1.45rem;letter-spacing:3px;color:var(--accent);flex-shrink:0;}
.hdr-spacer{flex:1;}
.hdr-score{
  font-family:var(--display);font-size:1rem;color:var(--accent3);letter-spacing:1px;
  background:rgba(61,214,140,.08);border:1px solid rgba(61,214,140,.18);
  padding:3px 10px;border-radius:8px;flex-shrink:0;
  display:none;
}
.timer-pill{
  font-family:var(--display);font-size:1.35rem;letter-spacing:3px;
  min-width:52px;text-align:center;padding:4px 10px;
  border-radius:10px;border:2px solid var(--border);
  background:var(--card);color:var(--muted);
  transition:all .3s;flex-shrink:0;
}
.timer-pill.active{border-color:var(--accent3);background:rgba(61,214,140,.07);color:var(--accent3);}
.timer-pill.urgent{border-color:var(--accent2);background:rgba(232,64,64,.12);color:var(--accent2);animation:tpulse .45s infinite alternate;}
@keyframes tpulse{from{transform:scale(1);}to{transform:scale(1.06);}}

.prog-wrap{height:3px;background:var(--border);flex-shrink:0;}
.prog-fill{height:100%;background:var(--accent);transition:width 1s linear;}

/* JOIN SCREEN */
#joinScreen{min-height:100%;display:flex;flex-direction:column;background:var(--bg);}
.join-hero{
  padding:32px 20px 20px;text-align:center;
  background:linear-gradient(180deg,rgba(245,197,24,.06) 0%,transparent 100%);
  border-bottom:1px solid var(--border);
  flex-shrink:0;
}
.join-logo-wrap{
  width:72px;height:72px;border-radius:20px;
  background:var(--accent);display:inline-flex;align-items:center;justify-content:center;
  font-size:2.4rem;margin-bottom:14px;
  box-shadow:0 8px 32px rgba(245,197,24,.3);
}
.join-title{font-family:var(--display);font-size:2.4rem;letter-spacing:5px;color:var(--text);margin-bottom:5px;}
.join-sub{font-family:var(--mono);font-size:.65rem;color:var(--muted);letter-spacing:2px;}

.join-body{flex:1;padding:18px 16px 24px;display:flex;flex-direction:column;gap:16px;}
.section-lbl{font-family:var(--mono);font-size:.6rem;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:8px;}
.avatar-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;}
.avatar-btn{
  aspect-ratio:1;border-radius:10px;border:2px solid transparent;
  background:var(--card);cursor:pointer;font-size:1.4rem;
  display:flex;align-items:center;justify-content:center;
  transition:all .12s;
}
.avatar-btn.selected{border-color:var(--accent);background:rgba(245,197,24,.1);transform:scale(1.06);}

.join-form{display:flex;flex-direction:column;gap:10px;}
.field-lbl{font-family:var(--mono);font-size:.58rem;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-bottom:5px;display:block;}
.inp{
  width:100%;background:var(--card);
  border:2px solid var(--border);color:var(--text);
  padding:13px 15px;font-family:var(--mono);font-size:.95rem;
  border-radius:10px;outline:none;
}
.inp:focus{border-color:var(--accent);background:var(--card2);}
.pin-inp{letter-spacing:10px;font-size:1.4rem;text-align:center;font-family:var(--display);}
.btn-join{
  width:100%;font-family:var(--display);font-size:1.15rem;letter-spacing:4px;
  padding:15px;border:none;cursor:pointer;border-radius:var(--radius);
  background:var(--accent);color:#000;
  transition:all .15s;
}

/* WAIT SCREEN */
#waitScreen{
  min-height:calc(100vh - 57px);display:none;
  flex-direction:column;align-items:center;justify-content:center;
  padding:20px;position:relative;overflow:hidden;
}
.wait-avatar-big{font-size:4.5rem;line-height:1;animation:avatarFloat 2.5s ease infinite;}
@keyframes avatarFloat{0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);}}
.wait-name{font-family:var(--display);font-size:1.6rem;letter-spacing:3px;color:var(--accent);}
.wait-status{
  font-family:var(--mono);font-size:.68rem;color:var(--muted);line-height:1.8;
  background:var(--card);border:1px solid var(--border);
  border-radius:10px;padding:12px 16px;width:100%;
}
.player-chip{
  background:rgba(245,197,24,.08);border:1px solid rgba(245,197,24,.22);
  color:var(--accent);font-family:var(--mono);font-size:.72rem;
  padding:5px 14px;border-radius:20px;cursor:pointer;
}

/* FINISHED SCREEN */
#finishedScreen{display:none;min-height:calc(100vh - 57px);flex-direction:column;align-items:center;justify-content:center;padding:24px;gap:18px;text-align:center;}
.finished-icon{font-size:4rem;}
.finished-title{font-family:var(--display);font-size:2.2rem;letter-spacing:4px;color:var(--accent);}
.finished-card{width:100%;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:22px;}
.finished-pts{font-family:var(--display);font-size:4.5rem;color:var(--accent3);letter-spacing:3px;}

/* GAME SCREEN */
#gameScreen{display:none;flex:1;flex-direction:column;min-height:calc(100vh - 57px);}
.game-wrap{flex:1;display:flex;flex-direction:column;padding:12px 12px 16px;gap:10px;}
.kahoot-grid{display:grid;gap:8px;flex:1;}
.kbtn{
  border:none;border-radius:var(--radius);padding:0;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:6px;min-height:90px;transition:all .12s;
}
.kbtn-sym{font-size:2.8rem;color:#fff;opacity:.9;}
.kbtn-txt{font-family:var(--mono);font-size:.7rem;color:#fff;display:none;}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-logo">⚡ USEV</div>
  <div class="hdr-spacer"></div>
  <div class="hdr-score" id="myScore">0 PT</div>
  <div class="timer-pill" id="timerPill">-</div>
</div>
<div class="prog-wrap"><div class="prog-fill" id="progFill" style="width:100%"></div></div>

<div class="screen-root" id="screen">
  <!-- JOIN -->
  <div id="joinScreen">
    <div class="join-hero">
      <div class="join-logo-wrap">⚡</div>
      <div class="join-title">USEV</div>
      <div class="join-sub">DÜŞÜN · YARIŞ · KAZAN</div>
    </div>
    <div class="join-body">
      <div class="avatar-section-lbl">Avatarını seç</div>
      <div class="avatar-grid" id="avatarGrid"></div>
      <div class="join-form">
        <div>
          <label class="field-lbl" for="nameInp">Adınız</label>
          <input class="inp" id="nameInp" placeholder="Adınızı girin" maxlength="20">
        </div>
        <div>
          <label class="field-lbl" for="pinInp">Parola</label>
          <input class="inp pin-inp" id="pinInp" placeholder="····" maxlength="4" inputmode="numeric">
        </div>
        <div class="pin-error" id="pinError" style="color:var(--accent2);font-family:var(--mono);font-size:.62rem;text-align:center;"></div>
        <button class="btn-join" onclick="joinGame()">OYUNA GİR →</button>
      </div>
    </div>
  </div>

  <!-- WAIT -->
  <div id="waitScreen">
    <div class="wait-content">
      <div class="wait-avatar-big" id="waitAvatar">🤖</div>
      <div class="wait-name" id="waitName">-</div>
      <div class="wait-status">
        Moderatörün yarışmayı başlatması bekleniyor...
      </div>
      <div class="player-chip" id="playerChip">👤 -</div>
    </div>
  </div>

  <!-- GAME -->
  <div id="gameScreen">
    <div class="game-wrap">
      <div id="kahootGrid" class="kahoot-grid"></div>
    </div>
  </div>

  <!-- FINISHED -->
  <div id="finishedScreen">
    <div class="finished-icon">🏆</div>
    <div class="finished-title">OYUN BİTTİ!</div>
    <div class="finished-card">
      <div class="finished-lbl">TOPLAM PUANIN</div>
      <div class="finished-pts" id="finalScore">0 PT</div>
    </div>
    <div style="font-family:var(--mono);font-size:.68rem;color:var(--muted);">Büyük ekrandaki podyumu izleyin! 🎉</div>
  </div>
</div>

<script type="module" src="./js/player/main.js"></script>
</body>
</html>
